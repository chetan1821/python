{% extends "base.html" %}

{% block body %}

<div class="container py-5">

    <h2 class="text-center mb-5 fw-bold">Our Products</h2>

    <div class="row g-4">

        {% for product in products %}
        <div class="col-lg-4 col-md-6">

            <div class="card product-card shadow border-0 h-100">

                <!-- Image -->
                <div class="img-container">
                    <img src="{{ product.image.url }}" class="card-img-top">
                </div>

                <!-- Content -->
                <div class="card-body text-center">

                    <h5 class="fw-bold">{{ product.name }}</h5>

                    <p class="text-muted">
                        {{ product.description|truncatewords:12 }}
                    </p>

                    <h4 class="text-success fw-bold">₹ {{ product.price }}</h4>

                    <span class="badge bg-dark">{{ product.category }}</span>

                </div>

                <!-- Buttons -->
                <div class="card-footer bg-white border-0 text-center">

                    <a href="#" class="btn btn-outline-primary btn-sm">View</a>

                    <form action="{% url 'delete_product' product.id %}" method="POST" style="display:inline;">
                        {% csrf_token %}
                        <button class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete this product?');">
                            🗑 Delete
                        </button>
                    </form>

                </div>

            </div>

        </div>
        {% endfor %}

    </div>

</div>

<style>

/* Bigger Card */
.product-card {
    border-radius: 18px;
    overflow: hidden;
    transition: 0.3s;
}

/* Hover Effect */
.product-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
}

/* Image Container Fix */
.img-container {
    height: 260px;   /* 🔥 bigger image */
    overflow: hidden;
}

/* Image Fit Properly */
.img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;   /* 🔥 important */
    transition: 0.4s;
}

/* Zoom Effect */
.product-card:hover img {
    transform: scale(1.1);
}

</style>

{% endblock %}
