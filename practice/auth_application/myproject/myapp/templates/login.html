<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Simple Login</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: #f5f7fb;
}

.login-container {
    min-height: 100vh;
}

.login-card {
    border: none;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    background: #fff;
    animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

.login-title {
    font-weight: 600;
    margin-bottom: 10px;
}

.login-subtitle {
    font-size: 14px;
    color: #6c757d;
    margin-bottom: 30px;
}

.form-control {
    border-radius: 10px;
    padding: 12px;
    border: 1px solid #e0e0e0;
}

.form-control:focus {
    box-shadow: none;
    border-color: #4f46e5;
}

.btn-login {
    background: #4f46e5;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-weight: 500;
    transition: 0.3s;
}

.btn-login:hover {
    background: #4338ca;
}

.extra-links {
    margin-top: 15px;
    font-size: 14px;
}

.extra-links a {
    text-decoration: none;
    color: #4f46e5;
}

.extra-links a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="container login-container d-flex justify-content-center align-items-center">
    <div class="col-md-5 col-lg-4">
        <div class="login-card">

            <h4 class="login-title">Sign In</h4>
            <p class="login-subtitle">Welcome back! Please enter your details</p>

            <form action="" method="post">
                {% csrf_token %}
                <div class="mb-3">
                        <span class="text-danger">{{err}}</span>
                    </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" class="form-control" placeholder="Enter email" name="u_name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter password" name="pwd">
                </div>

                <div class="d-flex justify-content-between mb-3">
                    <div>
                        <input type="checkbox"> Remember me
                    </div>
                    <a href="#">Forgot?</a>
                </div>

                <button type="submit" class="btn btn-login w-100">Login</button>

                <div class="text-center extra-links">
                    <p class="mt-3 mb-0">Don't have an account? <a href="{% url 'register'%}">Register</a></p>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
