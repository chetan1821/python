<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(to right, #4facfe, #00f2fe);
            min-height: 100vh;
            padding: 40px;
        }

        .container{
            width: 90%;
            max-width: 1100px;
            margin: auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .title{
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 35px;
        }

        .success-msg{
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        form{
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        form input{
            padding: 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        form input:focus{
            border-color: #4facfe;
            box-shadow: 0 0 5px rgba(79,172,254,0.5);
        }

        .add-btn{
            padding: 12px 25px;
            border: none;
            background: #4facfe;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .add-btn:hover{
            background: #008cdd;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 10px;
        }

        thead{
            background: #4facfe;
            color: white;
        }

        th, td{
            padding: 15px;
            text-align: center;
        }

        tbody tr{
            border-bottom: 1px solid #ddd;
            transition: 0.3s;
        }

        tbody tr:hover{
            background: #f5f9ff;
        }

        .btn{
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .delete-btn{
            background: #e74c3c;
        }

        .delete-btn:hover{
            background: #c0392b;
        }

        .update-btn{
            background: #f39c12;
        }

        .update-btn:hover{
            background: #d68910;
        }

        @media(max-width:768px){

            form{
                flex-direction: column;
                align-items: center;
            }

            form input{
                width: 100%;
            }

            table{
                font-size: 14px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1 class="title">Employee Management System</h1>

        {% if msg %}
        <div class="success-msg">
            {{ msg }}
        </div>
        {% endif %}

        <form method="POST">
    {% csrf_token %}

    <input type="text"
           name="name"
           placeholder="Enter Employee Name"
           value="{{ edit_emp.name }}"
           required>

    <input type="email"
           name="email"
           placeholder="Enter Employee Email"
           value="{{ edit_emp.email }}"
           required>

    <input type="number"
           name="age"
           placeholder="Enter Employee Age"
           value="{{ edit_emp.age }}"
           required>

    {% if edit_emp %}
        <button type="submit" class="add-btn">
            Update Employee
        </button>
    {% else %}
        <button type="submit" class="add-btn">
            Add Employee
        </button>
    {% endif %}
</form>

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                {% for emp in employee %}
                <tr>

                    <td>{{ emp.name }}</td>
                    <td>{{ emp.email }}</td>
                    <td>{{ emp.age }}</td>

                    <td>
                        <td><a href="{%url 'delete'%}?did={{emp.id}}">Delete</a></td>
                        <td><a href="{%url 'update'%}?uid={{emp.id}}">Update</a></td>
                    </td>

                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

</body>
</html>
