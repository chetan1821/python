{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: #f4f6f9;
        }

        /* Sidebar */
        .sidebar {
            height: 100vh;
            width: 220px;
            background: #212529;
            position: fixed;
            top: 0;
            left: -220px;
            transition: 0.3s;
            z-index: 1000;
            padding-top: 20px;
        }

        .sidebar h4 {
            color: white;
            text-align: center;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 12px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #0d6efd;
        }

        .sidebar.active {
            left: 0;
        }

        /* Content */
        .content {
            margin-left: 0;
            padding: 20px;
        }

        /* Desktop */
        @media (min-width: 992px) {
            .sidebar {
                left: 0;
            }

            .content {
                margin-left: 220px;
            }

            .menu-btn {
                display: none;
            }
        }

        /* Overlay */
        #overlay {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
    </style>
</head>

<body>

<!-- Overlay -->
<div id="overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
    <h4><i class="bi bi-person-gear"></i> Admin</h4>

    <a href="{% url 'student' %}"> <i class="bi bi-mortarboard"></i> Student</a>
    <a href="{% url 'employee' %}"><i class="bi bi-person-badge"></i>  Employee</a>
    <a href="{% url 'product' %}"><i class="bi-box-seam"></i> Product</a>
</div>

<!-- Content -->
<div class="content">

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white shadow mb-4 rounded">
        <div class="container-fluid">

            <!-- Toggle Button -->
            <button class="btn btn-dark menu-btn" onclick="toggleSidebar()">☰</button>

            <span class="navbar-brand mb-0 h5">Dashboard</span>
        </div>
    </nav>

    {% block body %}
    {% endblock %}

</div>

<!-- JS -->
<script>
function toggleSidebar() {
    let sidebar = document.getElementById("sidebar");
    let overlay = document.getElementById("overlay");

    sidebar.classList.toggle("active");

    if (sidebar.classList.contains("active")) {
        overlay.style.display = "block";
    } else {
        overlay.style.display = "none";
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
