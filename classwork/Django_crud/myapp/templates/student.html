{% extends "base.html" %}
{% block title %}
Student Dashboard
{% endblock %}

{% block body %}

<div class="row">

    <!-- Form -->
    <div class="col-lg-4 mb-4">
        <div class="card shadow">
            <div class="card-body">
                <h5 class="text-primary mb-3">Add Student</h5>

                <form method="POST">
                    {% csrf_token %}

                    <input type="text" name="name" class="form-control mb-2" placeholder="Name" required>
                    <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
                    <input type="number" name="age" class="form-control mb-2" placeholder="Age" required>

                    <select name="course" class="form-control mb-3" required>
                        <option value="">Select Course</option>
                        <option>BCA</option>
                        <option>BBA</option>
                        <option>BSc IT</option>
                    </select>

                    <button class="btn btn-primary w-100">Add Student</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="col-lg-8">
        <div class="card shadow">
            <div class="card-body">

                <h5 class="mb-3">Student List</h5>

                <div class="table-responsive">
                    <table class="table table-hover text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Age</th>
                                <th>Course</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody>
                            {%for i in studentss%}
                            <tr>
                                
                                <td>{{i.id}}</td>
                                <td>{{i.name}}</td>
                                <td>{{i.email}}</td>
                                <td>{{i.age}}</td>
                                <td>{{i.course}}</td>
                                
                                <td>
                                    <a href="{%url 'delete'%}?did={{i.id}}" 
                                       class="btn btn-danger btn-sm">
                                       Delete
                                    </a>
                                    <a href="" 
                                       class="btn btn-primary btn-sm">
                                       Update
                                    </a>
                                </td>
                            </tr>
                            {%endfor%}
                        </tbody>

                    </table>
                </div>

            </div>
        </div>
    </div>

</div>

{% endblock %}
