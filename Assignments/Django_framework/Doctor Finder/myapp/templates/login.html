{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Doctor Finder</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="login-body">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="login-box">

        <!-- Left Side -->
        <div class="login-left d-none d-md-flex">
            <div>
                <h2>Doctor Finder</h2>
                <p>Find trusted doctors & book appointments instantly.</p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="login-right">

            <h3 class="mb-4 fw-bold text-center">Welcome Back</h3>

            <form method="POST">
                {% csrf_token %}

                <!-- Email -->
                <div class="form-floating mb-3">
                    <input type="text" name="uname" class="form-control" placeholder="Email" required>
                    <label>Enter Username</label>
                </div>

                <!-- Password -->
                <div class="form-floating mb-3">
                    <input type="password" name="pwd" class="form-control" placeholder="Password" required>
                    <label>Password</label>
                </div>
                <!-- Button -->
                <button class="btn login-btn w-100">Login</button>

                <p class="text-center mt-3">
                    Don't have an account? <a href="{%url 'reg'%}">Register</a>
                </p>

            </form>
        </div>

    </div>

</div>

</body>
</html>
